# Demo / review build -> GitHub Pages (capuamedia.github.io/cpf-masonry/).
# Production -> Cloudflare Pages, configured in the Cloudflare dashboard. See DEPLOY.md.
#
# One-time repo setup: Settings > Pages > Source = "GitHub Actions".

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let a newer commit supersede an older one.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` (not `install`) so the Linux sharp binaries resolve from the
      # lockfile. The lockfile is generated on Windows; sharp ships its platform
      # builds as optionalDependencies, so all of them must be present in it.
      - name: Install
        run: npm ci

      # Astro writes generated image variants to node_modules/.astro/assets and
      # reuses them on the next build. Locally that directory is ~444MB across
      # ~2400 files, which is why a laptop build finishes in seconds.
      #
      # Without this the runner starts cold every time and regenerates all of
      # them with sharp. That is the entire difference between the old
      # gh-pages route (47-51s, because the images were built on the laptop and
      # only the publish was remote) and this workflow's ~10 minutes. Restoring
      # a few hundred MB takes seconds; regenerating them does not.
      #
      # The cache is content-addressed by Astro itself, so a partial hit is
      # safe and useful: unchanged photographs reuse their variants and only
      # new or edited ones are generated. Hence the loose restore-key.
      - name: Restore generated images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ runner.os }}-${{ hashFiles('src/assets/**') }}
          restore-keys: |
            astro-assets-${{ runner.os }}-

      - name: Build
        env:
          # Drives the /cpf-masonry base path, the noindex meta, the
          # Disallow: / robots.txt, and dropping the sitemap.
          DEPLOY_TARGET: github-pages
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
